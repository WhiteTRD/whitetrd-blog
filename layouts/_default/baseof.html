<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "uk" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ "index.xml" | absURL }}">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  {{/* OG Meta */}}
  <meta property="og:title" content="{{ .Title | default .Site.Title }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">

  {{ if .Params.private }}<meta name="robots" content="noindex, nofollow">{{ end }}

  {{ partial "schema.html" . }}
  <script>var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark'){localStorage.removeItem('theme');t=null;}if(t)document.documentElement.setAttribute('data-theme',t);</script>
  <style>
    :root {
      --bg-primary: #fafafa;
      --bg-secondary: #f0f0f0;
      --bg-tertiary: #e5e5e5;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --text-tertiary: #999999;
      --accent: #555555;
      --accent-hover: #333333;
      --border-primary: #d0d0d0;
      --border-secondary: #e0e0e0;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
      --shadow-md: 0 2px 8px rgba(0,0,0,0.1);
      --selection-bg: #d0d0d0;
      --selection-text: #1a1a1a;
      --code-bg: #f0f0f0;
      --callout-bg: #f0f0f0;
      --callout-warning: #cc3333;
      --callout-insight: #2d8a56;
      --callout-info: #3366cc;
      --green: #2d8a56;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary: #0a0a0a;
        --bg-secondary: #141414;
        --bg-tertiary: #1a1a1a;
        --text-primary: #d4d4d4;
        --text-secondary: #888888;
        --text-tertiary: #555555;
        --accent: #999999;
        --accent-hover: #b0b0b0;
        --border-primary: #333333;
        --border-secondary: #1a1a1a;
        --shadow-sm: none;
        --shadow-md: none;
        --selection-bg: #333333;
        --selection-text: #d4d4d4;
        --code-bg: #141414;
        --callout-bg: #141414;
        --callout-warning: #f87171;
        --callout-insight: #34d399;
        --callout-info: #60a5fa;
        --green: #34d399;
      }
    }

    [data-theme="dark"] {
      --bg-primary: #0a0a0a;
      --bg-secondary: #141414;
      --bg-tertiary: #1a1a1a;
      --text-primary: #d4d4d4;
      --text-secondary: #888888;
      --text-tertiary: #555555;
      --accent: #999999;
      --accent-hover: #b0b0b0;
      --border-primary: #333333;
      --border-secondary: #1a1a1a;
      --shadow-sm: none;
      --shadow-md: none;
      --selection-bg: #333333;
      --selection-text: #d4d4d4;
      --code-bg: #141414;
      --callout-bg: #141414;
      --callout-warning: #f87171;
      --callout-insight: #34d399;
      --callout-info: #60a5fa;
      --green: #34d399;
    }

    pre span {
      color: var(--text-primary) !important;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    @keyframes blink { 50% { opacity: 0; } }

    html {
      background: var(--bg-primary);
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      max-width: 780px;
      margin: 0 auto;
      padding: 48px 24px 96px;
      font-size: 14px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    ::selection {
      background: var(--selection-bg);
      color: var(--selection-text);
    }

    strong, b {
      color: var(--text-primary);
      font-weight: 500;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s;
    }

    a:hover {
      color: var(--accent-hover);
    }

    a:visited {
      color: var(--accent);
    }

    h1, h2, h3 {
      font-weight: 600;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 6px;
      line-height: 1.3;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    h2 {
      font-size: 16px;
      color: var(--text-primary);
      margin: 48px 0 16px;
      border-bottom: none;
      padding-bottom: 0;
      text-transform: none;
      letter-spacing: normal;
    }
    h2::before {
      content: "## ";
      color: var(--text-tertiary);
      font-weight: 400;
    }

    h3 {
      font-size: 14px;
      margin-top: 24px;
      margin-bottom: 8px;
    }

    p {
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    ul, ol {
      margin: 12px 0;
      padding: 0 0 0 1.2em;
    }

    li {
      margin-bottom: 4px;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border-primary);
      margin: 40px 0;
    }

    .author {
      color: var(--text-secondary);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .intro {
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    pre {
      background: var(--code-bg) !important;
      border: 1px solid var(--border-primary);
      border-radius: 6px;
      padding: 16px 20px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.7;
      margin: 24px 0;
      color: var(--text-primary) !important;
      white-space: pre;
    }

    pre::-webkit-scrollbar {
      height: 6px;
    }

    pre::-webkit-scrollbar-track {
      background: transparent;
    }

    pre::-webkit-scrollbar-thumb {
      background: var(--border-primary);
      border-radius: 3px;
    }

    code {
      font-family: inherit;
      background: var(--code-bg);
      padding: 1px 4px;
      border-radius: 3px;
    }

    pre code {
      background: none;
      padding: 0;
      border-radius: 0;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    figure {
      margin: 24px 0;
      max-width: 100%;
    }

    figcaption {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    .chart-embed {
      margin: 24px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ─── Lightbox ─── */
    article figure img {
      width: 100%;
      border: 1px solid var(--border-primary);
      border-radius: 6px;
      cursor: zoom-in;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.94);
      overscroll-behavior: contain;
      opacity: 0;
      transition: opacity 0.15s ease-out;
    }

    .lightbox.is-open {
      opacity: 1;
    }

    .lightbox img {
      position: absolute;
      left: 0;
      top: 0;
      max-width: none;
      transform-origin: 0 0;
      touch-action: none;
      user-select: none;
      -webkit-user-drag: none;
      cursor: grab;
      border: 0;
      border-radius: 0;
    }

    .lightbox img.is-dragging {
      cursor: grabbing;
    }

    .lightbox-close,
    .lightbox-hint {
      position: fixed;
      z-index: 2;
      font-family: 'JetBrains Mono', monospace;
      color: #d4d4d4;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid #333;
      border-radius: 3px;
    }

    .lightbox-close {
      top: 14px;
      right: 14px;
      width: 30px;
      height: 30px;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      padding: 0;
    }

    .lightbox-close:hover {
      color: #fff;
      border-color: #666;
    }

    .lightbox-hint {
      left: 50%;
      transform: translateX(-50%);
      bottom: 14px;
      margin: 0;
      padding: 5px 12px;
      font-size: 11px;
      color: #888;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .lightbox-hint.is-faded {
      opacity: 0;
    }

    @media (max-width: 600px) {
      .lightbox-hint {
        font-size: 10px;
        padding: 4px 9px;
      }
    }

    .chart-embed iframe {
      width: 100%;
      max-width: 780px;
      aspect-ratio: 600 / 380;
      border: none;
      border-radius: 8px;
    }

    blockquote {
      border-left: 3px solid var(--border-primary);
      margin: 20px 0;
      padding: 8px 16px;
      font-style: italic;
      background: var(--bg-secondary) !important;
    }

    blockquote p {
      margin: 0;
    }

    /* ─── Table ─── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin: 24px 0;
      border: 1px solid var(--border-primary);
      border-radius: 6px;
      overflow: hidden;
    }

    th {
      text-align: left;
      padding: 10px 14px;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--border-primary);
    }

    td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border-primary);
      color: var(--text-primary);
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-secondary); }
    td:first-child { color: var(--green); font-weight: 500; }

    .callout {
      border: 1px solid var(--border-primary);
      padding: 12px 16px;
      margin: 20px 0;
      border-radius: 6px;
      background: var(--callout-bg);
    }

    .callout.warning {
      border-left: 3px solid var(--callout-warning);
    }

    .callout.insight {
      border-left: 3px solid var(--callout-insight);
    }

    .callout.cta {
      border: 2px solid var(--border-primary);
      padding: 16px 20px;
    }

    .callout.cta strong {
      font-size: 15px;
    }

    .callout strong {
      display: block;
      margin-bottom: 4px;
    }

    .callout p {
      margin-bottom: 0;
    }

    .callout.info {
      border-left: 3px solid var(--callout-info);
    }

    /* ─── Tags ─── */
    .tags {
      margin: 8px 0 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 3px;
      text-decoration: none;
      color: var(--green);
      background: rgba(78, 201, 112, 0.08);
      border: none;
      transition: background 0.15s;
    }

    .tag:visited {
      color: var(--green);
    }

    .tag:hover {
      background: rgba(78, 201, 112, 0.15);
      color: var(--green);
    }

    .posts {
      list-style: none;
      padding: 0;
    }

    .posts li {
      margin-bottom: 12px;
    }

    .date {
      color: var(--text-secondary);
      font-size: 13px;
      margin-right: 8px;
    }

    .excerpt {
      color: var(--text-tertiary);
      font-size: 13px;
    }

    .youtube-preview {
      margin: 20px 0;
    }

    .youtube-preview iframe {
      width: 100%;
      aspect-ratio: 16/9;
      border: none;
    }

    .sources {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border-primary);
    }

    .sources h3 {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .sources ul {
      list-style: none;
      padding: 0;
    }

    .sources li {
      margin-bottom: 4px;
    }

    .related-posts {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--border-primary);
    }

    .related-posts h3 {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .related-posts ul {
      list-style: none;
      padding: 0;
    }

    .related-posts li {
      margin-bottom: 4px;
    }

    .subscribe-inline {
      font-size: 14px;
      margin: 30px 0 20px;
    }

    /* ─── Breadcrumb ─── */
    .prompt-nav {
      margin-bottom: 40px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .prompt-nav a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.15s;
    }

    .prompt-nav a:hover {
      color: var(--text-primary);
    }

    .prompt-sep {
      color: var(--text-tertiary);
    }

    .prompt-current {
      color: var(--text-primary);
    }

    .prompt-dollar {
      color: var(--text-tertiary);
    }

    /* ─── Directory listing ─── */
    .dir-listing {
      margin: 16px 0;
      padding-left: 16px;
    }

    .dir-entry {
      line-height: 1.8;
    }

    .dir-count {
      color: var(--text-secondary);
      margin-left: 12px;
    }

    /* Focus visible */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ─── Footer ─── */
    footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--border-primary);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .theme-toggle {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 3px;
      opacity: 0.6;
      transition: opacity 0.15s;
    }

    .theme-toggle:hover {
      opacity: 1;
    }

    @media (max-width: 600px) {
      body {
        padding: 32px 14px 64px;
      }

      h1 {
        font-size: 18px;
      }

      pre {
        padding: 12px;
      }
    }

    /* View Transitions */
    @view-transition { navigation: auto; }

    .prompt-nav { view-transition-name: breadcrumb; }
    main { view-transition-name: content; }

    ::view-transition-old(content) {
      animation: 150ms ease-out both fade-out-slide;
    }
    ::view-transition-new(content) {
      animation: 200ms ease-out both fade-in-slide;
    }

    @keyframes fade-out-slide {
      to { opacity: 0; transform: translateY(8px); }
    }
    @keyframes fade-in-slide {
      from { opacity: 0; transform: translateY(-8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      ::view-transition-old(content),
      ::view-transition-new(content) {
        animation-duration: 0s;
      }
    }

    /* ─── Rainbow name ─── */
    .rainbow {
      --rainbow-dur: 4s;
      --rainbow-sat: 85%;
      --rainbow-lum: 42%;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .rainbow {
        --rainbow-lum: 64%;
      }
    }

    [data-theme="dark"] .rainbow {
      --rainbow-lum: 64%;
    }

    /* Each letter is pre-wound by a full cycle so the wave is already
       travelling on first paint instead of building up over 4s. */
    .rainbow-letter {
      animation: rainbow-letter var(--rainbow-dur) linear infinite;
      animation-delay: calc(var(--i) * var(--rainbow-dur) / var(--n) - var(--rainbow-dur));
    }

    @keyframes rainbow-letter {
      0% {
        color: inherit;
        text-shadow: none;
      }
      8% {
        color: hsl(calc(var(--i) * 360 / var(--n)), var(--rainbow-sat), var(--rainbow-lum));
        text-shadow: 0 0 14px hsla(calc(var(--i) * 360 / var(--n)), var(--rainbow-sat), var(--rainbow-lum), 0.55);
      }
      22%, 100% {
        color: inherit;
        text-shadow: none;
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .rainbow-letter {
        animation: none;
      }
    }
  </style>
</head>
<body>
  {{ partial "breadcrumb.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <p>&copy; {{ now.Year }} {{ .Site.Params.author | default .Site.Title }}</p>
  </footer>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme"></button>
  <script>
    (function() {
      var d = document.documentElement;
      var b = document.querySelector('.theme-toggle');
      var themes = ['light', 'dark'];
      var saved = localStorage.getItem('theme');
      if (saved && themes.indexOf(saved) === -1) saved = null;
      if (saved) d.setAttribute('data-theme', saved);

      function current() {
        var t = d.getAttribute('data-theme');
        if (t) return t;
        return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function label(t) {
        var next = themes[(themes.indexOf(t) + 1) % themes.length];
        return next;
      }

      function update() {
        b.textContent = label(current());
      }

      update();
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', update);

      window.toggleTheme = function() {
        var cur = current();
        var next = themes[(themes.indexOf(cur) + 1) % themes.length];
        d.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        update();
      };
    })();
  </script>
  <script>
    // Lightbox: click a figure image to inspect it at full resolution.
    // Wheel or pinch to zoom around the pointer, drag to pan, Esc to close.
    (function() {
      var thumbs = document.querySelectorAll('article figure img');
      if (!thumbs.length) return;

      var box, full, hint, nw, nh, scale, fitScale, tx, ty;
      var pointers = new Map();
      var pinchDist = 0, dragging = false, lastX = 0, lastY = 0;

      function build() {
        box = document.createElement('div');
        box.className = 'lightbox';

        full = document.createElement('img');
        full.alt = '';

        var close = document.createElement('button');
        close.className = 'lightbox-close';
        close.type = 'button';
        close.setAttribute('aria-label', 'Закрити');
        close.textContent = '×';

        hint = document.createElement('p');
        hint.className = 'lightbox-hint';
        hint.textContent = 'колесо — зум · перетягни — рух · Esc — закрити';

        box.appendChild(full);
        box.appendChild(close);
        box.appendChild(hint);
        document.body.appendChild(box);

        close.addEventListener('click', close_);
        box.addEventListener('click', function(e) {
          // Only a click on the backdrop closes; a drag that ends on it must not.
          if (e.target === box) close_();
        });
        box.addEventListener('wheel', onWheel, { passive: false });
        full.addEventListener('pointerdown', onDown);
        full.addEventListener('pointermove', onMove);
        full.addEventListener('pointerup', onUp);
        full.addEventListener('pointercancel', onUp);
        window.addEventListener('resize', function() { if (box.parentNode && box.classList.contains('is-open')) fit(); });
      }

      function render() {
        full.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
      }

      function fit() {
        var vw = window.innerWidth, vh = window.innerHeight;
        fitScale = Math.min(vw * 0.96 / nw, vh * 0.92 / nh);
        scale = fitScale;
        tx = (vw - nw * scale) / 2;
        ty = (vh - nh * scale) / 2;
        render();
      }

      function zoomTo(next, px, py) {
        // Keep whatever sits under the pointer pinned in place.
        var maxScale = Math.max(fitScale * 8, 4);
        next = Math.min(Math.max(next, fitScale * 0.9), maxScale);
        tx = px - (px - tx) * next / scale;
        ty = py - (py - ty) * next / scale;
        scale = next;
        render();
        hint.classList.add('is-faded');
      }

      function onWheel(e) {
        e.preventDefault();
        zoomTo(scale * (e.deltaY < 0 ? 1.18 : 1 / 1.18), e.clientX, e.clientY);
      }

      function onDown(e) {
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        full.setPointerCapture(e.pointerId);
        if (pointers.size === 1) {
          dragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
          full.classList.add('is-dragging');
        } else if (pointers.size === 2) {
          dragging = false;
          full.classList.remove('is-dragging');
          pinchDist = spread();
        }
      }

      function spread() {
        var p = Array.from(pointers.values());
        return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      }

      function centre() {
        var p = Array.from(pointers.values());
        return { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
      }

      function onMove(e) {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointers.size === 2) {
          var d = spread();
          if (pinchDist > 0) {
            var c = centre();
            zoomTo(scale * d / pinchDist, c.x, c.y);
          }
          pinchDist = d;
          return;
        }

        if (!dragging) return;
        tx += e.clientX - lastX;
        ty += e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        render();
        hint.classList.add('is-faded');
      }

      function onUp(e) {
        pointers.delete(e.pointerId);
        if (pointers.size < 2) pinchDist = 0;
        if (pointers.size === 0) {
          dragging = false;
          full.classList.remove('is-dragging');
        }
      }

      function open(src, alt) {
        if (!box) build();
        full.alt = alt || '';
        hint.classList.remove('is-faded');
        document.body.style.overflow = 'hidden';

        var probe = new Image();
        probe.onload = function() {
          nw = probe.naturalWidth;
          nh = probe.naturalHeight;
          full.src = src;
          full.style.width = nw + 'px';
          full.style.height = nh + 'px';
          fit();
          requestAnimationFrame(function() { box.classList.add('is-open'); });
        };
        probe.src = src;
      }

      function close_() {
        if (!box) return;
        box.classList.remove('is-open');
        document.body.style.overflow = '';
        pointers.clear();
        dragging = false;
        setTimeout(function() {
          if (!box.classList.contains('is-open')) full.removeAttribute('src');
        }, 200);
      }

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && box && box.classList.contains('is-open')) close_();
      });

      thumbs.forEach(function(img) {
        img.addEventListener('click', function() { open(img.currentSrc || img.src, img.alt); });
      });
    })();
  </script>
</body>
</html>
