{{- $name := .Params.author | default .Site.Params.author | default .Site.Title -}}
{{- $chars := split $name "" -}}
{{- $n := len $chars -}}
<span class="rainbow" style="--n:{{ $n }}"><span class="sr-only">{{ $name }}</span><span aria-hidden="true">
{{- range $i, $c := $chars -}}
<span class="rainbow-letter" style="--i:{{ $i }}">{{ $c }}</span>
{{- end -}}
</span></span>
